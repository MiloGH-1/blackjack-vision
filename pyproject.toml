[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bjvision"
version = "0.1.0"
description = "Camera-based blackjack assistant: card detection, basic strategy and odds"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "pyyaml>=6.0", "ultralytics>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
