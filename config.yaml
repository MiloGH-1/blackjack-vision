# Table rules
decks: 1                 # 1, 2, 4, 6 or 8 (also caps how many copies of a card can be seen)
dealer_hits_soft_17: false
double_after_split: true
surrender: true          # late surrender allowed
dealer_peeks: true       # dealer checks for blackjack with a 10 or A upcard

# Camera: an integer webcam index (0 = laptop, 1 = usually DroidCam/Iriun phone),
# a phone's Wi-Fi IP running DroidCam, e.g. "192.168.1.20" (-> http://...:4747/video),
# or any stream URL such as "http://192.168.1.20:8080/video"
camera: 0
frame_width: 1280
frame_height: 720

# Detection
model_path: models/cards.pt
confidence: 0.5
layout: left-right       # left-right: dealer left, you right. top-bottom: dealer above, you below
divider: 0.5             # where the dividing line sits, as a fraction of the width (or height)
rotate: 0                # 0, 90, 180 or 270: turn the camera picture, e.g. for a phone on its side
smoothing_window: 10     # frames considered
smoothing_min_hits: 6    # a card must appear in this many of them to count
